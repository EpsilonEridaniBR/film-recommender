# Local development services. Run Django itself from the venv:
#   docker compose up -d && python manage.py runserver
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: film
      POSTGRES_PASSWORD: film
      POSTGRES_DB: film
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
